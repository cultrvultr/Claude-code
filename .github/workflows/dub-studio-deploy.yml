name: Deploy Dub Studio to Cloudflare Pages

on:
  push:
    branches: [main, claude/brave-mendel-dxnsda]
    paths: ['dub-studio/**', '.github/workflows/dub-studio-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dub-studio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dub-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dub-studio/package-lock.json

      - run: npm ci

      # the stem splitter model (285 MB, pinned and checksummed in scripts/prepare-assets.mjs)
      - uses: actions/cache@v4
        with:
          path: dub-studio/node_modules/.cache/htdemucs_6s.onnx
          key: htdemucs6s-a3f5050696cd

      - run: npm run build

      # Production branch of the Pages project is "main"; deploying under that name publishes to dub-studio-7il.pages.dev
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dub-studio
          command: pages deploy dist --project-name dub-studio --branch main --commit-hash ${{ github.sha }}
