name: Deploy Dub Studio to Cloudflare Pages

on:
  push:
    branches: [main, claude/brave-mendel-dxnsda]
    paths: ['dub-studio/**', '.github/workflows/dub-studio-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dub-studio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dub-studio
    steps:
      # actions are pinned to exact commits (a moved tag cannot swap in new code that sees the Cloudflare token)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dub-studio/package-lock.json

      - run: npm ci

      - run: npm run build

      # Production branch of the Pages project is "main"; deploying under that name publishes to dub-studio-7il.pages.dev
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dub-studio
          command: pages deploy dist --project-name dub-studio --branch main --commit-hash ${{ github.sha }}
