name: Deploy to GitHub Pages

# Serves BOTH sites from one Pages artifact:
#   /                  → the Fortnite calculator app (unchanged)
#   /fortnite-insights → the machine-first Fortnite Insights blog
# SITE_URL / PATH_PREFIX for the blog are derived from the repo so the blog's
# machine surfaces (feeds, llms.txt, sitemap, per-post .json/.md) emit correct
# absolute URLs. Override the blog base by setting a `BLOG_SITE_URL` repo variable.

on:
  push:
    branches: [main, master, "claude/add-claude-documentation-XA3AI"]
  workflow_dispatch:
  # Rebuild a few times a day so scheduled content changes go live without a manual push.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Calculator app (unchanged behaviour) ---
      - name: Install calculator deps
        working-directory: fortnite-calculator-project-plan/app
        run: npm ci

      - name: Build calculator
        working-directory: fortnite-calculator-project-plan/app
        run: npm run build

      # --- Blog: resolve subpath URLs, gate, build ---
      - name: Resolve blog SITE_URL / PATH_PREFIX
        id: blog
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${{ vars.BLOG_SITE_URL }}" ]; then
            SITE_URL="${{ vars.BLOG_SITE_URL }}"
          else
            SITE_URL="https://${OWNER_LC}.github.io/${REPO}/fortnite-insights"
          fi
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "path_prefix=/${REPO}/fortnite-insights/" >> "$GITHUB_OUTPUT"
          echo "Blog will publish at: ${SITE_URL}"

      - name: Install blog deps
        working-directory: fortnite-insights-blog
        run: npm install

      - name: Test + validate blog
        working-directory: fortnite-insights-blog
        run: |
          npm test
          npm run validate

      - name: Build blog
        working-directory: fortnite-insights-blog
        run: npm run build
        env:
          SITE_URL: ${{ steps.blog.outputs.site_url }}
          PATH_PREFIX: ${{ steps.blog.outputs.path_prefix }}

      # --- Combine into one Pages artifact ---
      - name: Assemble deploy directory
        run: |
          set -e
          rm -rf _deploy && mkdir -p _deploy
          cp -r fortnite-calculator-project-plan/app/dist/. _deploy/
          mkdir -p _deploy/fortnite-insights
          cp -r fortnite-insights-blog/_site/. _deploy/fortnite-insights/
          echo "Assembled:" && ls -la _deploy && ls -la _deploy/fortnite-insights

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
