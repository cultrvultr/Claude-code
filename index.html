<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Clicker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.8s ease;
  }

  /* Backdrop styles */
  body.backdrop-galaxy {
    background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 60%, #000 100%);
  }
  body.backdrop-nebula {
    background: radial-gradient(ellipse at top left, #4a1942 0%, #1a1a3e 40%, #2d1b4e 70%, #0a0a1a 100%);
  }
  body.backdrop-moon {
    background: radial-gradient(ellipse at bottom, #2c3e50 0%, #1a1a2e 50%, #0d0d1a 100%);
  }
  body.backdrop-win {
    background: radial-gradient(ellipse at center, #1a3a1a 0%, #0a1a0a 60%, #000 100%);
  }

  /* Stars layer */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .game-container {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #fff;
    user-select: none;
  }

  .sprite {
    width: 180px;
    height: 180px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    transition: all 0.5s ease;
    position: relative;
    cursor: pointer;
  }

  .sprite.earth {
    background: radial-gradient(circle at 35% 35%, #4a90d9 0%, #2d6bb4 30%, #1a5c2e 50%, #2d6bb4 70%, #1a3a6e 100%);
    box-shadow: 0 0 40px rgba(74, 144, 217, 0.5), inset -20px -20px 40px rgba(0,0,0,0.3);
  }

  .sprite.sun {
    background: radial-gradient(circle at 35% 35%, #ffee58 0%, #ffca28 30%, #ff9800 60%, #f44336 100%);
    box-shadow: 0 0 60px rgba(255, 152, 0, 0.7), 0 0 120px rgba(255, 152, 0, 0.3);
  }

  .sprite.planet2 {
    background: radial-gradient(circle at 35% 35%, #b39ddb 0%, #7e57c2 40%, #4527a0 70%, #311b92 100%);
    box-shadow: 0 0 40px rgba(126, 87, 194, 0.5), inset -20px -20px 40px rgba(0,0,0,0.3);
  }

  .sprite.greenflag {
    background: radial-gradient(circle at 35% 35%, #66bb6a 0%, #43a047 40%, #2e7d32 70%, #1b5e20 100%);
    box-shadow: 0 0 60px rgba(76, 175, 80, 0.6), 0 0 120px rgba(76, 175, 80, 0.3);
  }

  .sprite:active {
    transform: scale(0.93);
  }

  .sprite-label {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .score-display {
    font-size: 64px;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
    margin-bottom: 5px;
  }

  .stage-label {
    font-size: 18px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .progress-bar-container {
    width: 300px;
    height: 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    margin: 0 auto 15px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .progress-bar {
    height: 100%;
    border-radius: 6px;
    transition: width 0.2s ease, background 0.5s ease;
  }

  .progress-bar.stage1 { background: linear-gradient(90deg, #2196F3, #64B5F6); }
  .progress-bar.stage2 { background: linear-gradient(90deg, #FF9800, #FFCA28); }
  .progress-bar.stage3 { background: linear-gradient(90deg, #7E57C2, #B39DDB); }
  .progress-bar.stage4 { background: linear-gradient(90deg, #4CAF50, #81C784); }

  .next-upgrade {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 30px;
  }

  .message {
    font-size: 28px;
    font-weight: bold;
    min-height: 40px;
    margin-bottom: 10px;
    text-shadow: 0 0 15px rgba(255,255,255,0.4);
    transition: opacity 0.3s ease;
  }

  .hint {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    margin-top: 20px;
  }

  .cooldown-indicator {
    width: 180px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin: 10px auto 0;
    overflow: hidden;
  }

  .cooldown-fill {
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    transition: width 0.05s linear;
  }

  .click-effect {
    position: absolute;
    pointer-events: none;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: float-up 0.8s ease-out forwards;
    z-index: 10;
  }

  @keyframes float-up {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
  }

  .upgrade-flash {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: white;
    pointer-events: none;
    z-index: 100;
    animation: flash 0.5s ease-out forwards;
  }

  @keyframes flash {
    0% { opacity: 0.6; }
    100% { opacity: 0; }
  }

  .win-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    animation: fade-in 0.5s ease;
  }

  .win-overlay h1 {
    font-size: 72px;
    color: #4CAF50;
    text-shadow: 0 0 40px rgba(76,175,80,0.6);
    margin-bottom: 20px;
  }

  .win-overlay p {
    font-size: 24px;
    color: rgba(255,255,255,0.7);
  }

  .win-overlay button {
    margin-top: 30px;
    padding: 12px 36px;
    font-size: 18px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .win-overlay button:hover { background: #388E3C; }

  @keyframes fade-in {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  /* Particle effect on click */
  .particle {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    animation: particle-fly 0.6s ease-out forwards;
  }

  @keyframes particle-fly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }
</style>
</head>
<body class="backdrop-galaxy">

<canvas class="stars" id="stars"></canvas>

<div class="game-container" id="game">
  <div class="message" id="message">Space to click, U to upgrade!</div>
  <div class="sprite-label" id="sprite-label">Earth</div>
  <div class="sprite earth" id="sprite" role="button" tabindex="0">🌍</div>
  <div class="cooldown-indicator"><div class="cooldown-fill" id="cooldown-fill"></div></div>
  <div class="score-display" id="score-display">0</div>
  <div class="stage-label" id="stage-label">Stage 1 &mdash; Galaxy</div>
  <div class="progress-bar-container">
    <div class="progress-bar stage1" id="progress-bar"></div>
  </div>
  <div class="next-upgrade" id="next-upgrade">Next upgrade at 100</div>
  <div class="hint">Press <b>SPACE</b> or click to score &bull; Upgrades happen automatically</div>
</div>

<script>
// ── Audio Engine (Web Audio API synthesized sounds) ─────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Simple synth functions to approximate Scratch sounds
function playClickSound() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

function playUpgradeSound() {
  ensureAudio();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
    gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.12);
    gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + i * 0.12 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.3);
    osc.start(audioCtx.currentTime + i * 0.12);
    osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
  });
}

function playWinSound() {
  ensureAudio();
  const melody = [523, 659, 784, 1047, 784, 1047, 1319];
  melody.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
    gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.15);
    gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + i * 0.15 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.4);
    osc.start(audioCtx.currentTime + i * 0.15);
    osc.stop(audioCtx.currentTime + i * 0.15 + 0.4);
  });
}

// Background music loops (simple ambient drones)
let bgMusicNodes = [];

function stopBgMusic() {
  bgMusicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  bgMusicNodes = [];
}

function playBgLoop(type) {
  stopBgMusic();
  ensureAudio();

  const configs = {
    beat: { freq: 110, type: 'sawtooth', lfoFreq: 4, vol: 0.06 },
    ambience: { freq: 80, type: 'sine', lfoFreq: 0.5, vol: 0.08 },
    drive: { freq: 150, type: 'square', lfoFreq: 2, vol: 0.05 },
  };

  const cfg = configs[type] || configs.beat;

  // Drone
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();

  osc.type = cfg.type;
  osc.frequency.value = cfg.freq;
  lfo.frequency.value = cfg.lfoFreq;
  lfoGain.gain.value = cfg.vol * 0.5;

  lfo.connect(lfoGain);
  lfoGain.connect(gain.gain);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.value = cfg.vol;

  osc.start();
  lfo.start();

  bgMusicNodes.push(osc, lfo);

  // Second harmonic
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = cfg.freq * 1.5;
  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);
  gain2.gain.value = cfg.vol * 0.3;
  osc2.start();
  bgMusicNodes.push(osc2);
}

// ── Stars Background ────────────────────────────────────────────────────
const starsCanvas = document.getElementById('stars');
const ctx = starsCanvas.getContext('2d');
let stars = [];

function initStars() {
  starsCanvas.width = window.innerWidth;
  starsCanvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * starsCanvas.width,
      y: Math.random() * starsCanvas.height,
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.005 + 0.002,
    });
  }
}

function drawStars() {
  ctx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
  stars.forEach(s => {
    s.alpha += Math.sin(Date.now() * s.speed) * 0.01;
    s.alpha = Math.max(0.1, Math.min(1, s.alpha));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

initStars();
drawStars();
window.addEventListener('resize', initStars);

// ── Game State ──────────────────────────────────────────────────────────
let score = 0;
let stage = 1;
let canClick = true;
let cooldownTimer = null;
let won = false;
let musicStarted = false;

const STAGES = [
  { min: 0, max: 99, next: 100, costume: 'earth', emoji: '🌍', backdrop: 'backdrop-galaxy', label: 'Stage 1 — Galaxy', spriteLabel: 'Earth', music: 'beat' },
  { min: 100, max: 199, next: 200, costume: 'sun', emoji: '☀️', backdrop: 'backdrop-nebula', label: 'Stage 2 — Nebula', spriteLabel: 'Sun', music: 'ambience' },
  { min: 200, max: 299, next: 300, costume: 'planet2', emoji: '🪐', backdrop: 'backdrop-moon', label: 'Stage 3 — Moon', spriteLabel: 'Planet', music: 'drive' },
  { min: 300, max: Infinity, next: null, costume: 'greenflag', emoji: '🏁', backdrop: 'backdrop-win', label: 'Stage 4 — Victory', spriteLabel: 'Victory', music: null },
];

const els = {
  score: document.getElementById('score-display'),
  sprite: document.getElementById('sprite'),
  spriteLabel: document.getElementById('sprite-label'),
  message: document.getElementById('message'),
  stageLabel: document.getElementById('stage-label'),
  progress: document.getElementById('progress-bar'),
  nextUpgrade: document.getElementById('next-upgrade'),
  cooldownFill: document.getElementById('cooldown-fill'),
  game: document.getElementById('game'),
};

// ── Game Logic ──────────────────────────────────────────────────────────
function getStageForScore(s) {
  return STAGES.findIndex(st => s >= st.min && s <= st.max);
}

function updateDisplay() {
  els.score.textContent = score;

  const stageIdx = getStageForScore(score);
  const st = STAGES[stageIdx];

  // Progress bar
  const stageProgress = st.next
    ? ((score - st.min) / (st.next - st.min)) * 100
    : 100;
  els.progress.style.width = Math.min(100, stageProgress) + '%';
  els.progress.className = 'progress-bar stage' + (stageIdx + 1);

  // Next upgrade text
  els.nextUpgrade.textContent = st.next
    ? `Next upgrade at ${st.next}`
    : 'Max level reached!';

  // Check stage transition
  if (stageIdx + 1 !== stage) {
    stage = stageIdx + 1;
    transitionToStage(stageIdx);
  }
}

function transitionToStage(idx) {
  const st = STAGES[idx];

  // Flash effect
  const flash = document.createElement('div');
  flash.className = 'upgrade-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 500);

  // Update visuals
  document.body.className = st.backdrop;
  els.sprite.className = 'sprite ' + st.costume;
  els.sprite.textContent = st.emoji;
  els.spriteLabel.textContent = st.spriteLabel;
  els.stageLabel.textContent = st.label;

  // Music
  if (st.music) {
    playBgLoop(st.music);
  } else {
    stopBgMusic();
  }

  // Upgrade sound
  if (idx > 0 && idx < 3) {
    playUpgradeSound();
    showMessage('Upgraded! 🚀');
  }

  // Win condition
  if (idx === 3 && !won) {
    won = true;
    playWinSound();
    showMessage('');
    setTimeout(() => showWinScreen(), 300);
  }
}

function showMessage(text) {
  els.message.textContent = text;
  if (text) {
    setTimeout(() => {
      if (els.message.textContent === text) {
        els.message.textContent = '';
      }
    }, 3000);
  }
}

function showWinScreen() {
  const overlay = document.createElement('div');
  overlay.className = 'win-overlay';
  overlay.innerHTML = `
    <h1>You Win!! 🎉</h1>
    <p>Final Score: ${score}</p>
    <button id="play-again">Play Again</button>
  `;
  document.body.appendChild(overlay);
  document.getElementById('play-again').addEventListener('click', () => {
    overlay.remove();
    resetGame();
  });
}

function resetGame() {
  score = 0;
  stage = 1;
  won = false;
  canClick = true;
  musicStarted = false;

  const st = STAGES[0];
  document.body.className = st.backdrop;
  els.sprite.className = 'sprite ' + st.costume;
  els.sprite.textContent = st.emoji;
  els.spriteLabel.textContent = st.spriteLabel;
  els.stageLabel.textContent = st.label;
  els.message.textContent = 'Space to click, U to upgrade!';
  stopBgMusic();
  updateDisplay();
}

function spawnClickEffect(x, y) {
  const el = document.createElement('div');
  el.className = 'click-effect';
  el.textContent = '+1';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function spawnParticles(originX, originY) {
  const colors = ['#fff', '#ff0', '#0ff', '#f0f', '#0f0'];
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    p.style.cssText = `
      left: ${originX}px; top: ${originY}px;
      width: 6px; height: 6px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      --dx: ${dx}px; --dy: ${dy}px;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }
}

function doClick() {
  if (!canClick || won) return;

  if (!musicStarted) {
    musicStarted = true;
    playBgLoop('beat');
    els.message.textContent = '';
  }

  score++;
  playClickSound();

  // Visual feedback
  const rect = els.sprite.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top;
  spawnClickEffect(cx - 10, cy - 10);
  spawnParticles(cx, cy + rect.height / 2);

  updateDisplay();

  // Cooldown (0.6s like in the Scratch project)
  canClick = false;
  els.cooldownFill.style.transition = 'none';
  els.cooldownFill.style.width = '100%';

  // Animate cooldown bar
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      els.cooldownFill.style.transition = 'width 0.6s linear';
      els.cooldownFill.style.width = '0%';
    });
  });

  clearTimeout(cooldownTimer);
  cooldownTimer = setTimeout(() => {
    canClick = true;
  }, 600);
}

// ── Input Handling ──────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    doClick();
  }
});

els.sprite.addEventListener('click', (e) => {
  doClick();
});

// Prevent spacebar scrolling
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') e.preventDefault();
});

// Initial display
updateDisplay();
</script>
</body>
</html>
